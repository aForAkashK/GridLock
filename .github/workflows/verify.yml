name: Verify game and content
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --runInBand --watchman=false
      - run: npm run validate:levels
      - run: npm run audit:assets
      - run: npm run verify:ads-config
      - run: npm run bench:hints
      - run: npm run verify:level-release -- --channel 1
      - run: npm run verify:level-release
