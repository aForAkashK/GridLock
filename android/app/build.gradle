apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
// Must come after the Android plugin. Processes google-services.json.
apply plugin: "com.google.gms.google-services"
apply plugin: "com.google.firebase.crashlytics"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. Default is "debug", "debugOptimized".
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "liteDebugOptimized", "prodDebug", "prodDebugOptimized"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = true

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

// Local secrets are ignored; CI may provide the equivalent environment variables.
def signingProperties = new Properties()
def signingFile = rootProject.file("signing.properties")
if (signingFile.exists()) signingFile.withInputStream { signingProperties.load(it) }
def uploadSetting = { name, env -> System.getenv(env) ?: signingProperties.getProperty(name) }
def uploadStoreFile = uploadSetting("storeFile", "GRIDLOCK_UPLOAD_STORE_FILE")
def uploadStorePassword = uploadSetting("storePassword", "GRIDLOCK_UPLOAD_STORE_PASSWORD")
def uploadKeyAlias = uploadSetting("keyAlias", "GRIDLOCK_UPLOAD_KEY_ALIAS")
def uploadKeyPassword = uploadSetting("keyPassword", "GRIDLOCK_UPLOAD_KEY_PASSWORD")
def hasUploadSigning = uploadStoreFile && uploadStorePassword && uploadKeyAlias && uploadKeyPassword
def playLicenseKeyFile = rootProject.file("play-licensing-public-key.txt")
def playLicenseKey = playLicenseKeyFile.exists() ? playLicenseKeyFile.text.replaceAll(/\s/, "") : ""
if (!(playLicenseKey ==~ /[A-Za-z0-9+\/=]*/)) {
    throw new GradleException("The Play licensing public key must be Base64.")
}
// AGP 9 includes the producer task name in the merged-library output path.
def crashlyticsNativeDir = layout.buildDirectory.dir("intermediates/merged_native_libs/release/mergeReleaseNativeLibs/out/lib")

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    // `namespace` is the code package (where R and BuildConfig are generated);
    // `applicationId` is the app's identity on Play and the key google-services
    // matches google-services.json against. They are allowed to differ, and the
    // Firebase project registers this app as com.akssoft.gridlock.
    namespace "com.gridlock"
    defaultConfig {
        applicationId "com.akssoft.gridlock"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 4
        versionName "1.0.3"
        manifestPlaceholders = [usesCleartextTraffic: "false"]
        buildConfigField "boolean", "QA_ENABLED", "false"
        buildConfigField "String", "PLAY_LICENSING_PUBLIC_KEY", "\"${playLicenseKey}\""
    }
    signingConfigs {
        release {
            if (hasUploadSigning) {
                storeFile file(uploadStoreFile)
                storePassword uploadStorePassword
                keyAlias uploadKeyAlias
                keyPassword uploadKeyPassword
            }
        }
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            manifestPlaceholders = [usesCleartextTraffic: "true"]
            signingConfig signingConfigs.debug
        }
        release {
            firebaseCrashlytics {
                nativeSymbolUploadEnabled true
                unstrippedNativeLibsDir crashlyticsNativeDir.get().asFile
            }
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
        // Release-mode timing without preview hooks; debug certificate lets
        // local testers update the development app without clearing its save.
        performance {
            initWith release
            firebaseCrashlytics { nativeSymbolUploadEnabled false; mappingFileUploadEnabled false }
            signingConfig signingConfigs.debug
            matchingFallbacks = ['release']
            debuggable false
            minifyEnabled true
            buildConfigField "boolean", "QA_ENABLED", "false"
        }
        qa {
            initWith release
            firebaseCrashlytics { nativeSymbolUploadEnabled false; mappingFileUploadEnabled false }
            signingConfig signingConfigs.debug
            matchingFallbacks = ['release']
            debuggable false
            minifyEnabled true
            buildConfigField "boolean", "QA_ENABLED", "true"
        }

    }
}

dependencies {
    // Play Console needs the Billing permission and SDK metadata to open the
    // product catalog. Checkout will connect to BillingClient on demand.
    implementation("com.android.billingclient:billing:8.3.0")
    // Already present via GMA; direct access enables supported on-demand startup.
    implementation("androidx.work:work-runtime:2.7.0")
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

// Never silently ship a release signed with the shared debug key.
tasks.configureEach { task ->
    if (task.name == "uploadCrashlyticsSymbolFileRelease") {
        task.dependsOn("archiveCrashlyticsSymbolsRelease")
    }
    if (task.name == "generateCrashlyticsSymbolFileRelease" || task.name == "injectCrashlyticsBuildIdsRelease") {
        task.dependsOn("mergeReleaseNativeLibs")
    }
    if (task.name == "bundleRelease") {
        task.doLast {
            if (fileTree(crashlyticsNativeDir).matching { include "**/*.so" }.isEmpty()) {
                throw new GradleException("Release native symbols missing. Check the AGP merged-native-libraries path before shipping.")
            }
        }
    }
    if (task.name == "validateSigningRelease") {
        task.doFirst {
            if (!hasUploadSigning) throw new GradleException("Production signing missing. See RELEASE_SIGNING.md; debug keys are never used for release.")
        }
    }
}

// The uploader deletes generated .sym files after sending them. Preserve a
// private build companion before upload; it is never packaged into the app.
tasks.register("archiveCrashlyticsSymbolsRelease", Zip) {
    dependsOn("generateCrashlyticsSymbolFileRelease")
    from(layout.buildDirectory.dir("crashlytics/release/nativeSymbols")) {
        include "**/*.sym"
    }
    destinationDirectory = layout.buildDirectory.dir("outputs/native-debug-symbols/release")
    archiveFileName = "crashlytics-native-symbols.zip"
}

// Metro copies current imports without removing old generated drawables.
// Clear only this task's generated image output when bundling actually runs.
// Otherwise removing an asset import can leave its image in later releases.
tasks.withType(com.facebook.react.tasks.BundleHermesCTask).configureEach { bundleTask ->
    bundleTask.doFirst {
        project.delete(bundleTask.resourcesDir.get().asFile)
    }
}
